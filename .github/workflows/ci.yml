name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  spincore-tests:
    name: SpinCore tests (swift test)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run SpinCore tests (release, faster)
        working-directory: Packages/SpinCore
        run: swift test -c release -Xswiftc -enable-testing

  ios-build:
    name: iOS app build (xcodebuild, simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Build Pongo for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Pongo.xcodeproj \
            -scheme Pongo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
